# ============================================================================
# ENGINE CONFIGURATION
# ============================================================================
# System configuration for AI engine management
# Model metadata is stored separately in tasks/engine-models.json
# ============================================================================

# Environment type: wsl | linux
# wsl   = engine runs on Windows host, managed from WSL2 (PowerShell needed for start/stop)
# linux = engine runs natively on Linux or inside WSL2 itself
OS_TYPE="wsl"

# Base directory - root of the AI projects and executables
# BASE_DIR="/mnt/c/ai/engines"
BASE_DIR="/mnt/c/Sviluppo/LM/engines"

# Windows directory
WIN_DIR="/mnt/c/Windows"

# Models directory - path to GGUF model  and ollama blobs
MODELS_ROOT="$BASE_DIR/Models"

# Valid engine names (whitelist)
VALID_ENGINES="ollama llama dummy"

# Engines that can manage multiple models
MULTI_MODEL_ENGINES="ollama"

# Can run multiple engine?
MULTI_ENGINE_ENABLED="false"

# OLLAMA configuration
OLLAMA_ENABLED="true"
OLLAMA_BIND="0.0.0.0"
OLLAMA_PORT="1234"
OLLAMA_API="openai" # can be openai or ollama (for api calls) 
OLLAMA_REPLACE_ON_LOAD="false" # Substitute running model when loading a new one
OLLAMA_HEALTH_CHECK="Ollama is running"

# LLAMA.CPP configuration
LLAMA_ENABLED="false"
LLAMA_BIND="0.0.0.0"
LLAMA_PORT="12345"
LLAMA_HEALTH_CHECK="default_generation_settings"

# Logging directory - relative to codebase
LOG_DIR="./logs"

VALID_COMMANDS="status config models start stop load unload remove show"

COMMAND_SYNTAX='{
    "config": "config",
    "models": "models",
    "status": "status [engine]",
    "start": "start <engine> [model] [users]",
    "stop": "stop <engine>",
    "load": "load <engine> [model] [users]",
    "unload": "unload <engine> <model>",
    "show": "show <engine>",
    "remove": "remove <engine> <model>"
}'

COMMAND_HELP='Error: LLM Manager
Usage: engine-run.sh <action> [engine] [args...]
actions:
    config                           Global config
    models [-h]                      List available models (-h human readable)
    status <engine>                  Show global or engine status
    start <engine> [model] [users]   Start an engine
    stop <engine>                    Stop an engine
    load <engine> [model] [users]    Load a model
    unload <engine> <model>          Unload a model
    show <engine> <model>            Show engine details
    remove <engine> <model>          Remove a model and engine
'

# Exit codes
EXIT_SUCCESS=0
EXIT_ERROR=1
EXIT_NOT_FOUND=2
EXIT_ALREADY_RUNNING=3
EXIT_NOT_RUNNING=4
